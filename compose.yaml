# Include GPU profile configurations
# Usage: docker compose --profile cuda up    (NVIDIA)
#        docker compose --profile rocm up    (AMD)
include:
  - compose.profiles.yaml

# Default logging configuration for all services
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

# Build configuration - uses BuildKit for better caching and performance
# Run ./scripts/setup_buildx.sh to install BuildX if needed
x-build-config: &build-config
  platforms:
    - linux/amd64
  cache_from:
    - type=local,src=/tmp/.buildx-cache
  cache_to:
    - type=local,dest=/tmp/.buildx-cache-new,mode=max

services:
  web:
    profiles:
      - web  # Optional: only starts with --profile web
    build:
      context: .
      dockerfile: frontend/Dockerfile
      <<: *build-config
    ports:
      - "5000:80"
    env_file:
      - .env
    environment:
      - BRAIN_URL
    depends_on:
      - brain
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:80/api/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  chroma:
    image: chromadb/chroma:latest
    restart: unless-stopped
    logging: *default-logging
    environment:
      - CHROMA_SERVER_HOST=0.0.0.0
      - CHROMA_SERVER_HTTP_PORT=8000
      - CHROMA_DB_IMPL=duckdb+parquet
      - PERSIST_DIRECTORY=/data
      - ANONYMIZED_TELEMETRY=False
    volumes:
      - ./data/chroma:/data
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys;u='http://localhost:8000/api/v2/heartbeat';\ntry:\n r=urllib.request.urlopen(u,timeout=3); sys.exit(0 if r.status==200 else 1)\nexcept Exception:\n sys.exit(1)\"" ]
      interval: 10s
      timeout: 5s
      retries: 5

  sqlite-backup:
    image: python:3.13-slim
    restart: unless-stopped
    depends_on:
      - chroma
    working_dir: /app
    env_file:
      - .env
    environment:
      - BACKUPS_DIR
      - UPLOAD_MODE
      - B2_BUCKET_PREFIX
      - B2_ENDPOINT_URL
      - B2_KEY_ID
      - B2_APPLICATION_KEY
      - B2_BUCKET_NAME
    volumes:
      - ./scripts:/app/scripts:ro
      - ./data/chroma:/data
    command:
      - sh
      - -lc
      - |
        set -euo pipefail
        apt-get update -qq && apt-get install -y -qq sqlite3 > /dev/null 2>&1
        python -m pip install --no-cache-dir boto3 python-dotenv > /dev/null 2>&1
        mkdir -p /data/backups
        echo "[backup+upload] starting hourly loop"
        while true; do
          ts=$$(date -u +%Y%m%dT%H%M%SZ)
          echo "[backup+upload] $$ts creating backup"
          if sqlite3 /data/chroma.sqlite3 ".backup /data/backups/chroma-$$ts.sqlite3"; then
            echo "[backup+upload] $$ts backup successful, uploading to B2"
            python /app/scripts/upload_backups_b2.py || echo "[backup+upload] upload failed (will retry next cycle)"
            echo "[backup+upload] $$ts cleaning old backups (keeping 10)"
            ls -1t /data/backups/chroma-*.sqlite3 2>/dev/null | tail -n +11 | xargs -r rm --
          else
            echo "[backup+upload] $$ts backup failed, skipping upload"
          fi
          echo "[backup+upload] sleeping for 3600s (1h)"
          sleep 3600
        done

  memory-consolidation:
    image: python:3.13-slim
    restart: unless-stopped
    depends_on:
      - brain
      - chroma
    working_dir: /app
    env_file:
      - .env
    environment:
      - CHROMA_URL
      - OLLAMA_BASE_URL
      - OLLAMA_MODEL
      - OLLAMA_EMBED_MODEL
    volumes:
      - ./brain:/app/brain:ro
      - ./scripts:/app/scripts:ro
    command:
      - sh
      - -c
      - |
        set -euo pipefail
        # Install dependencies
        pip install --no-cache-dir httpx chromadb python-dotenv > /dev/null 2>&1
        echo "[consolidation] starting nightly loop (runs at 02:00 UTC)"
        while true; do
          # Calculate seconds until next 02:00 UTC
          now_hour=$(date -u +%H)
          now_min=$(date -u +%M)
          now_sec=$(date -u +%S)
          current_seconds=$((now_hour * 3600 + now_min * 60 + now_sec))
          target_seconds=$((2 * 3600))  # 02:00 = 7200 seconds
          if [ $$current_seconds -lt $$target_seconds ]; then
            sleep_seconds=$$((target_seconds - current_seconds))
          else
            sleep_seconds=$$((86400 - current_seconds + target_seconds))
          fi
          echo "[consolidation] sleeping for $$sleep_seconds seconds until next run"
          sleep $$sleep_seconds
          echo "[consolidation] running nightly consolidation"
          python /app/scripts/consolidate_memories.py || echo "[consolidation] failed (will retry next cycle)"
        done

  brain:
    build:
      context: .
      dockerfile: brain/Dockerfile
      <<: *build-config
    env_file:
      - .env
    logging: *default-logging
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "8000:7000"
    environment:
      # Core services
      - OLLAMA_BASE_URL
      - OLLAMA_MODEL
      - OLLAMA_EMBED_MODEL
      - CHROMA_URL
      # Integrations
      - SEARXNG_URL
      - LISTENBRAINZ_USER
      - LISTENBRAINZ_TOKEN
      # Enable D-Bus for MPRIS (now_playing specialist)
      - DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/1000/bus
    volumes:
      - ./data/brain:/data
      # Mount D-Bus socket for MPRIS (now_playing specialist)
      - /run/user/${UID:-1000}/bus:/run/user/1000/bus:ro
    depends_on:
      - chroma
      - ollama
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:7000/v1/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Matrix bridge - connects Ada to Matrix chat rooms
  matrix-bridge:
    build:
      context: ./matrix-bridge
      <<: *build-config
    container_name: ada-matrix-bridge
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - ./matrix-bridge/.env
    environment:
      # Matrix connection
      - MATRIX_HOMESERVER
      - MATRIX_USER_ID
      - MATRIX_ACCESS_TOKEN
      - MATRIX_PASSWORD
      # Bot identity
      - DISPLAY_NAME=Ada [Bot]
      # Ada brain connection
      - ADA_BRAIN_URL=http://brain:7000
      # Behavior
      - SEND_INTRO_ON_JOIN=true
      - AUTO_ACCEPT_INVITES=true
      - TYPING_INDICATOR=true
      # Privacy
      - ALLOW_PRIVACY_OPT_OUT=true
      - STORE_IN_RAG=true
      - DATA_RETENTION_DAYS=90
      # Logging
      - LOG_LEVEL=INFO
    volumes:
      - ./data/matrix:/data
    depends_on:
      - brain
    # Uncomment to disable Matrix bridge
    # profiles:
    #   - matrix

  # Ollama LLM server (CPU-only by default)
  # For GPU: docker compose --profile cuda up  (NVIDIA)
  #          docker compose --profile rocm up  (AMD)
  # See compose.profiles.yaml and docs/hardware.rst for details
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - .env
    environment:
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:-24h}
    volumes:
      - ./data/ollama:/root/.ollama
    command: ["serve"]

  # One-shot helper that pulls the required model once Ollama is healthy
  ollama-init:
    image: curlimages/curl:8.10.1
    depends_on:
      - ollama
    restart: "no"
    command:
      - 'sh'
      - '-lc'
      - |
        set -euxo pipefail
        printf '[ollama-init] %s waiting for API…
        ' "$(date -u +%FT%TZ)"
        until curl -fsS http://ollama:11434/api/tags >/dev/null 2>&1; do
          sleep 2
          printf '[ollama-init] %s still waiting…
          ' "$(date -u +%FT%TZ)"
        done
        printf '[ollama-init] %s API up. Pulling deepseek-r1…
        ' "$(date -u +%FT%TZ)"
        curl -sS -X POST -H 'Content-Type: application/json' -d '{"name":"deepseek-r1"}' http://ollama:11434/api/pull &
        pid1=$$!
        while kill -0 $$pid1 2>/dev/null; do
          printf '[ollama-init] %s pulling deepseek-r1… (still running)
          ' "$(date -u +%FT%TZ)"
          sleep 30
        done
        wait $$pid1
        printf '[ollama-init] %s Pulling nomic-embed-text…
        ' "$(date -u +%FT%TZ)"
        curl -sS -X POST -H 'Content-Type: application/json' -d '{"name":"nomic-embed-text"}' http://ollama:11434/api/pull &
        pid2=$$!
        while kill -0 $$pid2 2>/dev/null; do
          printf '[ollama-init] %s pulling nomic-embed-text… (still running)
          ' "$(date -u +%FT%TZ)"
          sleep 30
        done
        wait $$pid2
        printf '[ollama-init] %s model pulls complete.
        ' "$(date -u +%FT%TZ)"


  # Standalone uploader for manual/catch-up runs (optional, not auto-started)
  # To run manually: docker compose run --rm b2-uploader-manual
  b2-uploader-manual:
    image: python:3.13-slim
    profiles: ["manual"]
    working_dir: /app
    env_file:
      - .env
    environment:
      - BACKUPS_DIR=${BACKUPS_DIR:-/data/chroma/backups}
      - UPLOAD_MODE=${UPLOAD_MODE:-all}
      - B2_BUCKET_PREFIX=${B2_BUCKET_PREFIX:-chroma-backups}
    volumes:
      - ./scripts:/app/scripts:ro
      - ./data/chroma:/data/chroma:ro
    command:
      - sh
      - -lc
      - |
        set -euo pipefail
        python -m pip install --no-cache-dir boto3 python-dotenv > /dev/null 2>&1
        python /app/scripts/upload_backups_b2.py

  # Tooling container for running utility scripts, migrations, health checks, etc.
  # Shares dependencies and environment with brain service
  # Usage: docker compose run --rm scripts python /app/scripts/health_check_chroma.py
  scripts:
    build:
      context: .
      dockerfile: scripts/Dockerfile
      <<: *build-config
    profiles: ["tools"]
    env_file:
      - .env
    environment:
      - CHROMA_URL
      - OLLAMA_BASE_URL
      - OLLAMA_MODEL
      - OLLAMA_EMBED_MODEL
    volumes:
      - ./brain:/app/brain:ro
      - ./scripts:/app/scripts
      - ./tests:/app/tests:ro
      - ./examples:/app/examples:ro
      - ./seed:/app/seed:ro
      - ./persona.md:/app/persona.md:ro
      - ./data:/data
      - ./.ai:/app/.ai:ro
      - ./frontend:/app/frontend:ro
    depends_on:
      - chroma
      - ollama
    # No command - meant to be run with: docker compose run --rm scripts <command>
