services:
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5000:80"
    env_file:
      - .env
    environment:
      - BRAIN_URL=${BRAIN_URL:-http://brain:7000}
    depends_on:
      - brain
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:80/api/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  chroma:
    image: chromadb/chroma:latest
    restart: unless-stopped
    environment:
      - CHROMA_SERVER_HOST=0.0.0.0
      - CHROMA_SERVER_HTTP_PORT=8000
      - CHROMA_DB_IMPL=duckdb+parquet
      - PERSIST_DIRECTORY=/data
      - ANONYMIZED_TELEMETRY=False
    volumes:
      - ./data/chroma:/data
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys;u='http://localhost:8000/api/v2/heartbeat';\ntry:\n r=urllib.request.urlopen(u,timeout=3); sys.exit(0 if r.status==200 else 1)\nexcept Exception:\n sys.exit(1)\"" ]
      interval: 10s
      timeout: 5s
      retries: 5

  sqlite-backup:
    image: python:3.13-slim
    restart: unless-stopped
    depends_on:
      - chroma
    working_dir: /app
    env_file:
      - .env
    environment:
      - BACKUPS_DIR=${BACKUPS_DIR:-/data/backups}
      - UPLOAD_MODE=${UPLOAD_MODE:-latest}
      - B2_BUCKET_PREFIX=${B2_BUCKET_PREFIX:-chroma-backups}
    volumes:
      - ./scripts:/app/scripts:ro
      - ./data/chroma:/data
    command:
      - sh
      - -lc
      - |
        set -euo pipefail
        apt-get update -qq && apt-get install -y -qq sqlite3 > /dev/null 2>&1
        python -m pip install --no-cache-dir boto3 python-dotenv > /dev/null 2>&1
        mkdir -p /data/backups
        echo "[backup+upload] starting hourly loop"
        while true; do
          ts=$(date -u +%Y%m%dT%H%M%SZ)
          echo "[backup+upload] $ts creating backup"
          if sqlite3 /data/chroma.sqlite3 ".backup /data/backups/chroma-$ts.sqlite3"; then
            echo "[backup+upload] $ts backup successful, uploading to B2"
            python /app/scripts/upload_backups_b2.py || echo "[backup+upload] upload failed (will retry next cycle)"
            echo "[backup+upload] $ts cleaning old backups (keeping 10)"
            ls -1t /data/backups/chroma-*.sqlite3 2>/dev/null | tail -n +11 | xargs -r rm --
          else
            echo "[backup+upload] $ts backup failed, skipping upload"
          fi
          echo "[backup+upload] sleeping for 3600s (1h)"
          sleep 3600
        done

  brain:
    build:
      context: .
      dockerfile: brain/Dockerfile
    env_file:
      - .env
    environment:
      - OLLAMA_API_URL=${OLLAMA_API_URL:-http://ollama:11434/api/generate}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-deepseek-r1}
      - OLLAMA_EMBED_MODEL=${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama:11434}
      - CHROMA_URL=${CHROMA_URL:-http://chroma:8000}
      - RAG_AUTOLOAD_PERSONA=${RAG_AUTOLOAD_PERSONA:-true}
      - RAG_PERSONA_PATH=${RAG_PERSONA_PATH:-/app/persona.md}
      - RAG_AUTOLOAD_FAQ=${RAG_AUTOLOAD_FAQ:-false}
      - RAG_FAQ_PATH=${RAG_FAQ_PATH:-/app/seed/faqs.jsonl}
      - RAG_ENABLE_PERSONA=${RAG_ENABLE_PERSONA:-true}
      - RAG_ENABLE_FAQ=${RAG_ENABLE_FAQ:-true}
      - RAG_ENABLE_MEMORY=${RAG_ENABLE_MEMORY:-true}
      - RAG_ENABLE_SUMMARY=${RAG_ENABLE_SUMMARY:-true}
      - RAG_TURNS_TOP_K=${RAG_TURNS_TOP_K:-4}
      - RAG_FAQ_TOP_K=${RAG_FAQ_TOP_K:-2}
      - RAG_MEMORY_TOP_K=${RAG_MEMORY_TOP_K:-3}
      - RAG_MEMORY_IMPORTANCE_WEIGHT=${RAG_MEMORY_IMPORTANCE_WEIGHT:-0.5}
      - RAG_SUMMARY_EVERY_N=${RAG_SUMMARY_EVERY_N:-8}
      - RAG_SUMMARY_TURNS_WINDOW=${RAG_SUMMARY_TURNS_WINDOW:-12}
      - RAG_DEBUG=${RAG_DEBUG:-true}
    volumes:
      - ./data/brain:/data
    depends_on:
      - chroma
      - ollama
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:7000/v1/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  ollama:
    image: ollama/ollama:rocm
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:-24h}
      - OLLAMA_GPU_DRIVER=${OLLAMA_GPU_DRIVER:-rocm}
      # Optionally limit to a specific GPU index, otherwise expose all
      # - HIP_VISIBLE_DEVICES=${HIP_VISIBLE_DEVICES:-0}
      # Some GPUs may require an ISA override; leave commented unless needed
      # - HSA_OVERRIDE_GFX_VERSION=${HSA_OVERRIDE_GFX_VERSION:-10.3.0}
      # If your ROCm libs aren’t in default linker paths inside the image, uncomment:
      # - LD_LIBRARY_PATH=${LD_LIBRARY_PATH:-/opt/rocm/lib:/opt/rocm/lib64:/opt/rocm/hip/lib}
    devices:
      - "/dev/kfd:/dev/kfd"
      - "/dev/dri:/dev/dri"
    group_add:
      - "video"
    # Mount ROCm userspace libraries (host path may vary by distro/ROCm version)
    volumes:
      - ./data/ollama:/root/.ollama
      - /opt/rocm:/opt/rocm:ro
    # Run Ollama in server mode; model pulling is handled by a separate init job
    command: ["serve"]

  # One-shot helper that pulls the required model once Ollama is healthy
  ollama-init:
    image: curlimages/curl:8.10.1
    depends_on:
      - ollama
    restart: "no"
    command:
      - 'sh'
      - '-lc'
      - |
        set -euxo pipefail
        printf '[ollama-init] %s waiting for API…
        ' "$(date -u +%FT%TZ)"
        until curl -fsS http://ollama:11434/api/tags >/dev/null 2>&1; do
          sleep 2
          printf '[ollama-init] %s still waiting…
          ' "$(date -u +%FT%TZ)"
        done
        printf '[ollama-init] %s API up. Pulling deepseek-r1…
        ' "$(date -u +%FT%TZ)"
        curl -sS -X POST -H 'Content-Type: application/json' -d '{"name":"deepseek-r1"}' http://ollama:11434/api/pull &
        pid1=$!
        while kill -0 $pid1 2>/dev/null; do
          printf '[ollama-init] %s pulling deepseek-r1… (still running)
          ' "$(date -u +%FT%TZ)"
          sleep 30
        done
        wait $pid1
        printf '[ollama-init] %s Pulling nomic-embed-text…
        ' "$(date -u +%FT%TZ)"
        curl -sS -X POST -H 'Content-Type: application/json' -d '{"name":"nomic-embed-text"}' http://ollama:11434/api/pull &
        pid2=$!
        while kill -0 $pid2 2>/dev/null; do
          printf '[ollama-init] %s pulling nomic-embed-text… (still running)
          ' "$(date -u +%FT%TZ)"
          sleep 30
        done
        wait $pid2
        printf '[ollama-init] %s model pulls complete.
        ' "$(date -u +%FT%TZ)"


  # Standalone uploader for manual/catch-up runs (optional, not auto-started)
  # To run manually: docker compose run --rm b2-uploader-manual
  b2-uploader-manual:
    image: python:3.13-slim
    profiles: ["manual"]
    working_dir: /app
    env_file:
      - .env
    environment:
      - BACKUPS_DIR=${BACKUPS_DIR:-/data/chroma/backups}
      - UPLOAD_MODE=${UPLOAD_MODE:-all}
      - B2_BUCKET_PREFIX=${B2_BUCKET_PREFIX:-chroma-backups}
    volumes:
      - ./scripts:/app/scripts:ro
      - ./data/chroma:/data/chroma:ro
    command:
      - sh
      - -lc
      - |
        set -euo pipefail
        python -m pip install --no-cache-dir boto3 python-dotenv > /dev/null 2>&1
        python /app/scripts/upload_backups_b2.py
