services:
  web:
    build:
      context: .
      dockerfile: webserver/Dockerfile
    network_mode: host
    environment:
      - OLLAMA_API_URL=http://localhost:11434/api/generate
      - OLLAMA_MODEL=deepseek-r1
      - OLLAMA_EMBED_MODEL=nomic-embed-text
      - OLLAMA_BASE_URL=http://localhost:11434
      - CHROMA_URL=http://localhost:8000
      # RAG autoload seed data
      - RAG_AUTOLOAD_PERSONA=true
      - RAG_PERSONA_PATH=/app/prompt.md
      - RAG_AUTOLOAD_FAQ=false
      - RAG_FAQ_PATH=/app/seed/faqs.jsonl
      # RAG section toggles and sizes
      - RAG_ENABLE_PERSONA=true
      - RAG_ENABLE_FAQ=true
      - RAG_TURNS_TOP_K=4
      - RAG_FAQ_TOP_K=2
      - RAG_DEBUG=true
    volumes:
      - ./webserver/static:/app/static
      - ./data:/data
    depends_on:
      - chroma

  chroma:
    image: chromadb/chroma:latest
    container_name: chroma
    restart: unless-stopped
    environment:
      - CHROMA_SERVER_HOST=0.0.0.0
      - CHROMA_SERVER_HTTP_PORT=8000
      - CHROMA_DB_IMPL=duckdb+parquet
      - ANONYMIZED_TELEMETRY=False
    volumes:
      - ./data/chroma:/chroma
    ports:
      - "8000:8000"