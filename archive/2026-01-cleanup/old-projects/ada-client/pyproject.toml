[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ada-client"
version = "1.0.0"
description = "Python client for Ada brain REST API"
readme = "README.md"
requires-python = ">=3.13"
license = {text = "MIT"}
authors = [
    {name = "Luna System", email = "ada@luna-system.dev"}
]
keywords = ["ada", "llm", "client", "api"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
]

[project.urls]
Homepage = "https://github.com/luna-system/ada"
Documentation = "https://ada.luna-system.dev"
Repository = "https://github.com/luna-system/ada"

[tool.hatch.build.targets.wheel]
packages = ["src/ada_client"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
