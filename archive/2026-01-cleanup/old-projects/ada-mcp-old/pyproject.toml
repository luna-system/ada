[project]
name = "ada-mcp"
version = "0.1.0"
description = "Model Context Protocol server for Ada - brings your personal AI to any editor"
authors = [
    {name = "luna-system"}
]
readme = "README.md"
requires-python = ">=3.11"
license = {text = "CC0 1.0 Universal"}
keywords = ["mcp", "ada", "ai", "assistant", "editor-integration"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "ada-client>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
]

[project.urls]
Homepage = "https://github.com/luna-system/ada"
Documentation = "https://luna-system.github.io/ada/"
Repository = "https://github.com/luna-system/ada"
Issues = "https://github.com/luna-system/ada/issues"

[project.scripts]
ada-mcp = "ada_mcp.server:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]  # Line too long (handled by formatter)

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
