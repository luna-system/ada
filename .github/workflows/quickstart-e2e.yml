name: Quick Start End-to-End Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    paths:
      - 'README.md'
      - 'compose.yaml'
      - 'brain/**'
      - '.env.example'
      - 'examples/**'

jobs:
  quickstart-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Free up disk space
      run: |
        # Remove unnecessary packages to save space for Docker images
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /opt/ghc
        sudo rm -rf "/usr/local/share/boost"
        sudo rm -rf "$AGENT_TOOLSDIRECTORY"
        df -h
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    # Follow the quick start instructions exactly as documented
    - name: "Quick Start Step 1: Setup environment"
      run: |
        # This is what a user would do - we skip "git clone" since we're already in the repo
        cp .env.example .env
        
        # Use a smaller model for CI to save time/resources
        sed -i 's/OLLAMA_MODEL=.*/OLLAMA_MODEL=qwen2.5:0.5b/' .env
        
        # Test the identity configuration feature
        echo "AI_NAME=TestBot" >> .env
        echo "AI_USER_NAME=tester" >> .env
        
        echo "=== Environment configured ==="
        cat .env
    
    - name: "Quick Start Step 2: Start services"
      run: |
        docker compose up -d
        echo "=== Services started ==="
        docker compose ps
    
    - name: "Wait for services to be healthy"
      run: |
        echo "Waiting for services to become healthy..."
        timeout=300  # 5 minutes max
        elapsed=0
        
        while [ $elapsed -lt $timeout ]; do
          # Check if all services are healthy or running
          status=$(docker compose ps --format json | jq -r '.[].Health' | grep -v "healthy" | wc -l)
          
          if [ "$status" -eq "0" ]; then
            echo "✅ All services are healthy!"
            docker compose ps
            break
          fi
          
          echo "⏳ Waiting for services... (${elapsed}s elapsed)"
          sleep 10
          elapsed=$((elapsed + 10))
          
          # Show service status
          docker compose ps
        done
        
        if [ $elapsed -ge $timeout ]; then
          echo "❌ Services failed to become healthy within timeout"
          docker compose logs
          exit 1
        fi
    
    - name: "Verify brain API is responding"
      run: |
        echo "Testing /v1/healthz endpoint..."
        response=$(curl -s -w "\n%{http_code}" http://localhost:7000/v1/healthz)
        http_code=$(echo "$response" | tail -n1)
        body=$(echo "$response" | head -n-1)
        
        echo "HTTP Status: $http_code"
        echo "Response: $body"
        
        if [ "$http_code" != "200" ]; then
          echo "❌ Health check failed"
          docker compose logs brain
          exit 1
        fi
        
        echo "✅ Brain API is healthy"
    
    - name: "Verify identity configuration"
      run: |
        echo "Testing /v1/info endpoint for identity configuration..."
        response=$(curl -s http://localhost:7000/v1/info)
        echo "Response: $response"
        
        # Check if our custom identity is reflected
        if echo "$response" | jq -e '.ai_name == "TestBot"' > /dev/null; then
          echo "✅ Custom AI name (TestBot) configured correctly"
        else
          echo "❌ AI name not configured correctly"
          exit 1
        fi
        
        if echo "$response" | jq -e '.user_name == "tester"' > /dev/null; then
          echo "✅ Custom user name (tester) configured correctly"
        else
          echo "❌ User name not configured correctly"
          exit 1
        fi
    
    - name: "Test basic chat functionality"
      run: |
        echo "Sending a test chat message..."
        
        # Make a basic chat request
        response=$(curl -s -X POST http://localhost:7000/v1/chat/stream \
          -H "Content-Type: application/json" \
          -d '{
            "conversation_id": "test-e2e-001",
            "prompt": "Say hello and confirm your name.",
            "config": {
              "include_thinking": false
            }
          }')
        
        echo "Response received:"
        echo "$response" | head -c 500
        
        # Verify we got a response
        if [ -z "$response" ]; then
          echo "❌ No response from chat endpoint"
          docker compose logs brain
          exit 1
        fi
        
        echo "✅ Chat endpoint is functional"
    
    - name: "Verify specialists are loaded"
      run: |
        echo "Checking available specialists..."
        response=$(curl -s http://localhost:7000/v1/specialists)
        echo "Response: $response"
        
        # Check for expected specialists
        specialist_count=$(echo "$response" | jq '.specialists | length')
        
        if [ "$specialist_count" -lt "3" ]; then
          echo "❌ Expected at least 3 specialists, got $specialist_count"
          exit 1
        fi
        
        echo "✅ Found $specialist_count specialists"
        echo "$response" | jq -r '.specialists[].name'
    
    - name: "Test persona customization"
      run: |
        echo "Testing persona swap (as documented in README)..."
        
        # Copy an example persona
        docker compose exec -T scripts sh -c "cp /app/examples/personas/coding-buddy.md /app/persona.md"
        
        # Restart brain service
        docker compose restart brain
        
        # Wait for brain to be ready
        sleep 15
        
        # Verify health after restart
        curl -f http://localhost:7000/v1/healthz || (echo "❌ Brain failed to restart"; exit 1)
        
        echo "✅ Persona customization works"
    
    - name: "Show service logs on failure"
      if: failure()
      run: |
        echo "=== Docker Compose Services ==="
        docker compose ps
        echo -e "\n=== Brain Logs ==="
        docker compose logs brain --tail=100
        echo -e "\n=== Ollama Logs ==="
        docker compose logs ollama --tail=50
        echo -e "\n=== ChromaDB Logs ==="
        docker compose logs chroma --tail=50
    
    - name: "Cleanup"
      if: always()
      run: |
        docker compose down -v
        docker system prune -f

  unit-and-integration-tests:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Start required services
      run: |
        docker compose up -d chroma ollama
        sleep 10
    
    - name: Run test suite
      run: |
        docker compose run --rm scripts pytest -v
    
    - name: Cleanup
      if: always()
      run: |
        docker compose down -v
