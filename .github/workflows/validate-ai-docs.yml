name: AI Documentation Validation

on:
  push:
    branches: [ trunk, develop ]
  pull_request:
    branches: [ trunk, develop ]
    paths:
      - 'brain/**/*.py'
      - '.ai/**'
      - 'tests/test_ai_documentation.py'
      - 'scripts/lint_ai_docs.py'

jobs:
  validate-ai-docs:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pathlib requests pydantic pydantic-settings
    
    - name: Run AI documentation linter
      run: |
        python scripts/lint_ai_docs.py
    
    - name: Run AI documentation tests
      run: |
        pytest tests/test_ai_documentation.py -v --tb=short
    
    - name: Check for stale documentation
      if: github.event_name == 'pull_request'
      run: |
        echo "Checking if documentation needs updates..."
        # If brain modules changed, remind to update docs
        if git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -q "^brain/"; then
          echo "⚠️  Brain modules changed. Please verify .ai/ documentation is up-to-date."
          echo "Run: python scripts/lint_ai_docs.py"
        fi
