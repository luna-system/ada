[project]
name = "ada-v1"
version = "1.8.0"
description = ""
authors = [
    {name = "luna system",email = "luna@airsi.de"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "click>=8.1.0",
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "gunicorn>=23.0.0",
    "httpx>=0.26.0",
    "requests>=2.32.5",
    # Configuration management
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.2.1",
    # RAG / vector store
    "chromadb>=0.5.11",
    # Offsite backups to Backblaze R2 (S3-compatible)
    "boto3>=1.35.0",
    # OCR and file upload
    "python-multipart>=0.0.9",
    "pytesseract>=0.3.10",
    "pillow>=10.0.0",
]

[project.optional-dependencies]
docs = [
    "sphinx>=7.0.0",
    "sphinx-rtd-theme>=2.0.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
ada = "ada_main:cli"

[tool.setuptools]
packages = ["brain", "brain.specialists"]
py-modules = ["ada_main"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
