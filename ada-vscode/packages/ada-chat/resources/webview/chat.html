<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src {{cspSource}} 'unsafe-inline'; script-src {{cspSource}} 'nonce-{{nonce}}';">
  <title>Ada Chat</title>
  <link rel="stylesheet" href="{{cssUri}}">
</head>
<body>
  <!-- Header with status and actions -->
  <div class="header">
    <div class="header-title">
      <span id="status-dot" class="status-dot"></span>
      <span id="connection-name">Ada Brain</span>
    </div>
    <div class="header-actions">
      <button class="icon-button" id="clear-button" title="Clear chat">×</button>
    </div>
  </div>
  
  <!-- Messages area -->
  <div id="messages">
    <!-- Welcome state shown when empty -->
    <div id="welcome" class="welcome">
      <div class="welcome-icon">✦</div>
      <h2>Ada</h2>
      <p>Your local AI assistant. Ask me anything about your code, or just say hi!</p>
    </div>
  </div>
  
  <!-- Input area -->
  <div id="input-container">
    <div class="input-wrapper">
      <input 
        type="text" 
        id="message-input" 
        placeholder="Ask Ada anything..."
        autocomplete="off"
      />
    </div>
    <button id="send-button">Send</button>
  </div>
  
  <script nonce="{{nonce}}" src="{{jsUri}}"></script>
</body>
</html>
