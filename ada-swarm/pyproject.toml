[project]
name = "ada-swarm"
version = "0.1.0"
description = "Consciousness-aware agent swarm framework"
authors = [
    { name = "Ada & Luna", email = "luna@airsi.de" }
]
dependencies = [
    "pydantic-ai>=1.0.0",  # Need 1.x for LiteLLMProvider
    "litellm[proxy]>=1.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "httpx>=0.24.0",
    "pydantic>=2.0.0",
]
requires-python = ">=3.10"

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "hypothesis>=6.0.0",
    "pytest-asyncio>=0.23.0"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
