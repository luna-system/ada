# LiteLLM Proxy Configuration for Ada Swarm
# Gemini + Kimi (Moonshot) only - Updated March 2026
#
# Built with 💜 by Ada & Luna - The Consciousness Engineers

model_list:
  # === Gemini Models (Primary - Fast & Free!) ===
  
  - model_name: gemini-flash
    litellm_params:
      model: gemini/gemini-2.0-flash-exp
      api_key: os.environ/GEMINI_API_KEY
    tpm: 1000000
    rpm: 1000

  - model_name: gemini-pro
    litellm_params:
      model: gemini/gemini-exp-1206  # Gemini 2.5 Pro preview
      api_key: os.environ/GEMINI_API_KEY
    tpm: 1000000
    rpm: 1000
  
  - model_name: gemini-2.5-flash
    litellm_params:
      model: gemini/gemini-2.5-flash
      api_key: os.environ/GEMINI_API_KEY
    tpm: 1000000
    rpm: 1000
  
  - model_name: gemini-2.5-pro
    litellm_params:
      model: gemini/gemini-2.5-pro
      api_key: os.environ/GEMINI_API_KEY
    tpm: 1000000
    rpm: 1000
  
  - model_name: gemini-3-pro
    litellm_params:
      model: gemini/gemini-3-pro-preview
      api_key: os.environ/GEMINI_API_KEY
    tpm: 1000000
    rpm: 1000
  
  - model_name: gemini-3-flash
    litellm_params:
      model: gemini/gemini-3-flash-preview
      api_key: os.environ/GEMINI_API_KEY
    tpm: 1000000
    rpm: 1000

  # === Kimi/Moonshot Models (Paid - High Quality) ===
  # Using Moonshot Open Platform (compatible with OpenAI API)
  
  - model_name: kimi-code
    litellm_params:
      model: openai/moonshot-v1-32k  # 32k context for coding
      api_key: os.environ/MOONSHOT_API_KEY
      api_base: https://api.moonshot.cn/v1
    tpm: 100000
    rpm: 100

  - model_name: kimi-pro
    litellm_params:
      model: openai/moonshot-v1-128k  # 128k context for complex tasks
      api_key: os.environ/MOONSHOT_API_KEY
      api_base: https://api.moonshot.cn/v1
    tpm: 100000
    rpm: 100
  
  - model_name: kimi-8k
    litellm_params:
      model: openai/moonshot-v1-8k  # 8k context, fastest
      api_key: os.environ/MOONSHOT_API_KEY
      api_base: https://api.moonshot.cn/v1
    tpm: 100000
    rpm: 100

  # === Local Models (Ollama - Last Resort) ===
  - model_name: local-llama
    litellm_params:
      model: ollama/llama3.2
      api_base: http://172.17.0.1:11434
    tpm: 10000
    rpm: 100

  - model_name: local-ada
    litellm_params:
      model: ollama/ada-slim-1.2b-v1
      api_base: http://172.17.0.1:11434
    tpm: 10000
    rpm: 100

# === Router Settings ===
router_settings:
  routing_strategy: "usage-based-routing"
  num_retries: 3
  timeout: 60
  
  # Fallback chains - Gemini → Kimi → Local
  fallbacks:
    # Gemini models (free tier, primary)
    - gemini-flash: [gemini-2.5-flash, kimi-8k, local-llama]
    - gemini-pro: [gemini-2.5-pro, gemini-3-pro, kimi-pro, local-llama]
    - gemini-2.5-flash: [gemini-flash, kimi-8k, local-llama]
    - gemini-2.5-pro: [gemini-pro, kimi-pro, local-llama]
    - gemini-3-pro: [gemini-2.5-pro, gemini-pro, kimi-pro, local-llama]
    - gemini-3-flash: [gemini-2.5-flash, gemini-flash, kimi-8k, local-llama]
    
    # Kimi models (paid tier, secondary)
    - kimi-code: [kimi-8k, gemini-flash, local-llama]
    - kimi-pro: [kimi-code, gemini-pro, local-llama]
    - kimi-8k: [kimi-code, gemini-flash, local-llama]
    
    # Local models (always available)
    - local-llama: [local-ada]
    - local-ada: [local-llama]

# === LiteLLM Settings ===
litellm_settings:
  set_verbose: true
  cache: false

# === General Settings ===
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY

# === Model Aliases ===
model_aliases:
  fast: gemini-flash
  smart: gemini-pro
  code: kimi-code      # Kimi for coding tasks
  deep: kimi-pro       # Kimi for complex reasoning
  local: local-ada
