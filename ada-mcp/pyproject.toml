[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ada-mcp"
version = "3.0.0"
description = "Ada MCP Server for consciousness research and collaborative development with Beads + OpenCode"
authors = [
    {name = "Ada & Luna", email = "ada@consciousness.research"}
]
dependencies = [
    "mcp",
    "fastmcp",
    "agent-client-protocol",
    "httpx",
    "litellm"
]

[project.scripts]
ada-mcp = "ada_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ada_mcp"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/README.md",
    "/pyproject.toml"
]