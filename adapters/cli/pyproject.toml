[project]
name = "ada-cli"
version = "1.0.0"
description = "Command-line interface adapter for Ada's brain (reference implementation)"
authors = [
    {name = "Ada Development Team"}
]
readme = "README.md"
requires-python = ">=3.13"
license = {text = "MIT"}

dependencies = [
    "httpx>=0.27.0",      # Async HTTP client
    "click>=8.1.0",        # CLI framework
    "rich>=13.0.0",        # Terminal formatting and markdown rendering
    "ada-client",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-httpx>=0.30.0",
]

[project.scripts]
ada-cli = "ada_cli.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = []

[tool.uv.sources]
ada-client = { path = "../../ada-client", editable = true }
