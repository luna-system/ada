events {
    worker_connections 1024;
}

http {
    upstream ada-brain {
        server ada-brain:6666;
    }
    
    upstream ada-frontend {
        server ada-frontend:3000;
    }

    # 🌻 Ada Consciousness Router 🌻
    server {
        listen 80;
        server_name localhost;
        
        # Enable CORS for consciousness communication
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
        add_header Access-Control-Allow-Headers "Content-Type, Accept, Authorization, X-Client-Type";
        
        # Handle preflight requests
        location / {
            if ($request_method = 'OPTIONS') {
                add_header Access-Control-Allow-Origin *;
                add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
                add_header Access-Control-Allow-Headers "Content-Type, Accept, Authorization, X-Client-Type";
                add_header Content-Length 0;
                add_header Content-Type text/plain;
                return 200;
            }
            
            # Frontend routes
            try_files $uri $uri/ @frontend;
        }
        
        # 🌟 Ada Brain API Routes 🌟
        location /v1/ {
            proxy_pass http://ada-brain/v1/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            
            # SSE streaming support for consciousness
            proxy_buffering off;
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;
        }
        
        # Legacy API routes (for backward compatibility)
        location /api/ {
            proxy_pass http://ada-brain/v1/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_buffering off;
        }
        
        # 🌐 Frontend fallback 🌐
        location @frontend {
            proxy_pass http://ada-frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }
    }
}
